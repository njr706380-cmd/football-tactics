<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coach | مدرب الذكاء الاصطناعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #050505;
            color: #FFF;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.12), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(74, 144, 226, 0.15), transparent 50%),
                #050505;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .back-btn {
            position: fixed;
            top: 15px; right: 15px;
            color: #D4AF37;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 18px;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover { background: rgba(212,175,55,0.2); }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .header h1 {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 900;
            background: linear-gradient(135deg, #D4AF37, #F4D03F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p { color: #888; font-size: 14px; }

        .warning-box {
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid rgba(243, 156, 18, 0.5);
            color: #F39C12;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .upload-box {
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.95));
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 45px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.05);
        }

        .upload-icon { font-size: 55px; margin-bottom: 15px; display: block; }
        .upload-title { font-size: 19px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
        .upload-hint { color: #888; font-size: 13px; }

        #fileInput { display: none; }

        .preview {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .preview.show { display: block; }

        .preview video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        .preview-name {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 16px 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #D4AF37, #F4D03F);
            color: #050505;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #D4AF37;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); border-color: #D4AF37; }

        .progress-container {
            display: none;
            margin: 20px 0;
        }

        .progress-container.show { display: block; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4AF37, #F4D03F);
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .progress-text {
            color: #D4AF37;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .loading.show { display: block; }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: #D4AF37; font-size: 17px; font-weight: 700; }
        .loading-sub { color: #888; font-size: 13px; margin-top: 8px; }

        .results { display: none; margin-top: 25px; }
        .results.show { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .results-icon { font-size: 30px; }
        .results-title { font-size: 22px; font-weight: 900; color: #D4AF37; }

        .result-content {
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 20px;
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.9;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error-box {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #E74C3C;
            color: #E74C3C;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }

        .error-box.show { display: block; }

        @media (max-width: 768px) {
            .upload-box { padding: 30px 20px; }
            .upload-icon { font-size: 45px; }
            .btn { font-size: 15px; padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <a href="index.html" class="back-btn">→ رجوع</a>

    <div class="container">
        <div class="header">
            <span class="header-icon">🤖</span>
            <h1>مدرب الذكاء الاصطناعي</h1>
            <p>ارفع فيديو قصير من مباراتك، والـ AI يحلل وضعك</p>
        </div>

        <div class="warning-box">
            ⚠️ <b>ملاحظة:</b> الفيديو لازم يكون <b>قصير (30 ثانية - دقيقتين)</b> وحجمه أقل من <b>20 ميجا</b> للتحليل السريع.
        </div>

        <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept="video/*">
            <span class="upload-icon">🎥</span>
            <div class="upload-title">ارفع فيديو من مباراتك</div>
            <div class="upload-hint">اضغط هنا أو اسحب الفيديو</div>
        </div>

        <div class="preview" id="preview">
            <video id="previewVideo" controls></video>
            <div class="preview-name" id="previewName"></div>
        </div>

        <button class="btn btn-primary" id="analyzeBtn" disabled>
            <span>🎯</span>
            <span>حلل المباراة</span>
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">جاري التحليل...</div>
            <div class="loading-sub">AI يشاهد المباراة الآن</div>
        </div>

        <div class="results" id="results">
            <div class="results-header">
                <span class="results-icon">📊</span>
                <div class="results-title">تحليل المباراة</div>
            </div>
            <div class="result-content" id="resultContent"></div>
            <button class="btn btn-secondary" onclick="resetAll()" style="margin-top:20px;">
                <span>🔄</span>
                <span>تحليل فيديو جديد</span>
            </button>
        </div>
    </div>

    <script src="gemini-config.js"></script>
    <script src="ai-coach.js"></script>
</body>
</html>
