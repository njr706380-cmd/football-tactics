<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرب الذكي | AI Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ========== قفل الواجهة بحجم الشاشة ========== */
html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    background: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.12), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(74,144,226,0.15), transparent 50%),
                #050505;
    background-attachment: fixed;
    font-family: 'Cairo', sans-serif;
    color: #FFF;
    display: flex;
    flex-direction: column;
}

.top-header { background: rgba(10,10,10,0.98); border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 12px 15px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.back-btn { color: #D4AF37; text-decoration: none; width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.3); background: rgba(0,0,0,0.3); font-size: 18px; }
.ai-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
.header-title-wrap { flex: 1; }
.header-title { font-size: 16px; font-weight: 900; color: #D4AF37; }
.header-status { font-size: 11px; color: #4CAF50; display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; }
.clear-btn { color: #888; background: transparent; border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; }

.mode-tabs { display: flex; padding: 10px 15px; gap: 8px; background: rgba(10,10,10,0.98);
    border-bottom: 1px solid rgba(212,175,55,0.2); flex-shrink: 0; }
.mode-tab { flex: 1; padding: 10px; background: transparent; border: 2px solid rgba(212,175,55,0.2);
    color: #888; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; }
.mode-tab.active { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; border-color: #D4AF37; }

/* ========== الأوضاع ========== */
.chat-mode { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.video-mode { display: none; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 15px; }
.video-mode.active { display: flex; }
.chat-mode.active { display: flex; }

/* المحادثة فقط تتحرك */
.chat-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 3px; }

.message { display: flex; gap: 10px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { flex-direction: row-reverse; }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 16px; flex-shrink: 0; }
.message.user .msg-avatar { background: rgba(212,175,55,0.2); border: 1px solid #D4AF37; }
.message.ai .msg-avatar { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; }
.msg-content { background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.15); border-radius: 18px;
    padding: 12px 16px; font-size: 14px; line-height: 1.8; max-width: calc(100% - 60px); white-space: pre-wrap; word-wrap: break-word; }
.message.user .msg-content { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.08)); border-color: rgba(212,175,55,0.4); }

.typing { display: flex; gap: 5px; padding: 6px 0; }
.typing span { width: 8px; height: 8px; background: #D4AF37; border-radius: 50%; animation: typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }

.welcome { text-align: center; padding: 30px 20px; }
.welcome-icon { font-size: 60px; margin-bottom: 15px; display: inline-block; }
.welcome h2 { font-size: 20px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
.welcome p { color: #888; font-size: 13px; line-height: 1.7; max-width: 400px; margin: 0 auto; }

.suggestions { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; flex-shrink: 0; }
.suggestion-btn { padding: 8px 14px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37; border-radius: 20px; font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; }

.input-area { padding: 12px 15px; background: rgba(10,10,10,0.98); border-top: 1px solid rgba(212,175,55,0.2);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.input-wrap { flex: 1; }
#userInput { width: 100%; background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.2);
    border-radius: 20px; padding: 12px 18px; color: #FFF; font-family: inherit; font-size: 14px;
    resize: none; outline: none; max-height: 120px; min-height: 44px; line-height: 1.5; }
#userInput:focus { border-color: rgba(212,175,55,0.5); }
#userInput::placeholder { color: #666; }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #050505; flex-shrink: 0; }

/* ========== الفيديو ========== */
.video-header { text-align: center; margin-bottom: 15px; }
.video-header h2 { color: #D4AF37; font-size: 18px; font-weight: 900; margin-bottom: 6px; }
.video-header p { color: #888; font-size: 12px; line-height: 1.6; }

/* زر الفيديو — الـ input داخله بطريقة آمنة */
.pick-btn {
    position: relative;
    display: block;
    width: 100%;
    padding: 20px;
    background: linear-gradient(135deg, #D4AF37, #F4D03F);
    color: #050505;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    margin-bottom: 15px;
    overflow: hidden;
}
.pick-btn input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

#videoStatus { background: rgba(76, 175, 80, 0.2); border: 2px solid #4CAF50;
    color: #81C784; border-radius: 12px; padding: 14px; font-size: 14px;
    margin-bottom: 15px; line-height: 1.6; font-weight: 700; text-align: center; }

#videoError { background: rgba(244, 67, 54, 0.2); border: 2px solid #F44336;
    color: #FF6B6B; border-radius: 12px; padding: 14px; font-size: 14px;
    margin-bottom: 15px; line-height: 1.6; font-weight: 700; text-align: center; }

.analyze-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    color: #050505; border: none; border-radius: 12px; font-family: inherit; font-size: 16px;
    font-weight: 900; cursor: pointer; margin-bottom: 15px; }
.analyze-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

#videoProgress { width: 100%; height: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }

.frames-title { color: #D4AF37; font-size: 13px; font-weight: 700; margin-bottom: 10px; display: none; }
.frames-title.show { display: block; }

#framesGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
.frame-item { position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(212,175,55,0.3); aspect-ratio: 16/9; background: #000; }
.frame-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame-time { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.75);
    color: #D4AF37; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }

/* الفيديو المساعد — صغير لكن ظاهر (ضروري لـ Firefox Android) */
#hiddenVideo {
    position: fixed;
    bottom: 5px;
    right: 5px;
    width: 40px;
    height: 22px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
}

#analysisResult { background: rgba(20,20,20,0.95); border: 1px solid rgba(212,175,55,0.4);
    border-radius: 16px; padding: 20px; margin-top: 20px; text-align: right; }
#analysisResult h3 { color: #D4AF37; font-size: 16px; font-weight: 900; margin-bottom: 15px; }
#analysisResult .content { color: #EEE; font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>

<div class="top-header">
    <a href="index.html" class="back-btn">→</a>
    <div class="ai-avatar">🤖</div>
    <div class="header-title-wrap">
        <div class="header-title">المدرب الذكي</div>
        <div class="header-status"><span class="status-dot"></span><span>متاح الآن</span></div>
    </div>
    <button class="clear-btn" id="clearBtn">مسح</button>
</div>

<div class="mode-tabs">
    <button class="mode-tab active" id="chatTab">💬 محادثة</button>
    <button class="mode-tab" id="videoTab">🎥 تحليل فيديو</button>
</div>

<div class="chat-mode active" id="chatMode">
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
            <span class="welcome-icon">⚽</span>
            <h2>أهلاً بك في المدرب الذكي</h2>
            <p>اسألني عن أي شي في eFootball: خطط، مدربين، تبديلات، تكتيكات...</p>
        </div>
    </div>
    <div class="suggestions">
        <button class="suggestion-btn" data-q="شنو أفضل خطة ضد 4-4-2؟">ضد 4-4-2</button>
        <button class="suggestion-btn" data-q="شلون أوقف المرتدات؟">إيقاف المرتدات</button>
        <button class="suggestion-btn" data-q="أنا خسران 1-0 بالدقيقة 70، شنو أسوي؟">خسران متأخر</button>
        <button class="suggestion-btn" data-q="أفضل مدرب لأسلوب الاستحواذ؟">مدرب استحواذ</button>
        <button class="suggestion-btn" data-q="شلون ألعب ضد الضغط العالي؟">ضد الضغط</button>
    </div>
    <div class="input-area">
        <div class="input-wrap">
            <textarea id="userInput" placeholder="اكتب سؤالك..." rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<div class="video-mode" id="videoMode">
    <div class="video-header">
        <h2>🎥 تحليل الفيديو التكتيكي</h2>
        <p>ارفع مقطع من مباراة eFootball (حتى 90 ثانية، 100 ميجابايت)</p>
    </div>

    <label class="pick-btn" id="pickBtn">
        📹 اضغط لاختيار فيديو
        <input type="file" id="videoFileInput" accept="video/*">
    </label>

    <video id="hiddenVideo" muted playsinline webkit-playsinline></video>

    <div id="videoStatus" style="display:none;">✅ تم اختيار الفيديو</div>
    <div id="videoError" style="display:none;">❌ خطأ</div>

    <button class="analyze-btn" id="analyzeVideoBtn" disabled>استخراج اللقطات</button>

    <progress id="videoProgress" value="0" max="100"></progress>

    <div class="frames-title" id="framesTitle">📸 اللقطات المستخرجة:</div>
    <div id="framesGrid"></div>
</div>

<script>
var WORKER_URL = "https://tactics-ai.njr706380.workers.dev";
var MODEL = "openai/gpt-oss-120b";
var MAX_VIDEO_SIZE_MB = 100;
var MAX_VIDEO_DURATION = 90;
var FRAME_COUNT = 12;
var FRAME_MAX_WIDTH = 480;

var selectedVideoFile = null;
var lastFileName = "";

// ============ POLLING لـ Firefox Android ============
setInterval(function() {
    var input = document.getElementById("videoFileInput");
    if (!input || !input.files || input.files.length === 0) return;
    var file = input.files[0];
    if (file.name === lastFileName && selectedVideoFile) return;
    lastFileName = file.name;
    handleFile(file);
}, 500);

document.getElementById("videoFileInput").onchange = function(e) {
    if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
    }
};

function handleFile(file) {
    var statusEl = document.getElementById("videoStatus");
    var errorEl = document.getElementById("videoError");
    var analyzeBtn = document.getElementById("analyzeVideoBtn");

    errorEl.style.display = "none";

    var sizeMB = file.size / (1024 * 1024);
    if (sizeMB > MAX_VIDEO_SIZE_MB) {
        errorEl.textContent = "❌ حجم الفيديو كبير (" + sizeMB.toFixed(1) + " MB). الحد " + MAX_VIDEO_SIZE_MB + " MB";
        errorEl.style.display = "block";
        return;
    }

    selectedVideoFile = file;
    analyzeBtn.disabled = false;
    statusEl.textContent = "✅ الفيديو جاهز: " + file.name + " (" + sizeMB.toFixed(2) + " MB)";
    statusEl.style.display = "block";
}

document.getElementById("analyzeVideoBtn").onclick = function() {
    if (!selectedVideoFile) return;
    startAnalysis(selectedVideoFile);
};

async function startAnalysis(file) {
    var analyzeBtn = document.getElementById("analyzeVideoBtn");
    var progress = document.getElementById("videoProgress");
    var statusEl = document.getElementById("videoStatus");
    var errorEl = document.getElementById("videoError");
    var framesGrid = document.getElementById("framesGrid");
    var framesTitle = document.getElementById("framesTitle");

    analyzeBtn.disabled = true;
    errorEl.style.display = "none";
    framesGrid.innerHTML = "";
    framesTitle.classList.remove("show");
    var old = document.getElementById("analysisResult");
    if (old) old.remove();

    progress.style.display = "block";
    progress.value = 0;

    var video = document.getElementById("hiddenVideo");
    video.preload = "auto";
    video.muted = true;

    var url = URL.createObjectURL(file);
    video.src = url;

    try {
        statusEl.textContent = "⏳ جاري تحميل الفيديو...";
        statusEl.style.display = "block";

        await waitCanPlay(video);

        try {
            video.currentTime = 0;
            await video.play();
            await new Promise(function(r) { setTimeout(r, 300); });
            video.pause();
        } catch (e) {}

        if (video.duration > MAX_VIDEO_DURATION) {
            errorEl.textContent = "❌ مدة الفيديو طويلة (" + Math.round(video.duration) + "s). الحد " + MAX_VIDEO_DURATION + "s";
            errorEl.style.display = "block";
            statusEl.style.display = "none";
            cleanupVideo(video, url);
            analyzeBtn.disabled = false;
            progress.style.display = "none";
            return;
        }

        statusEl.textContent = "⏳ جاري استخراج 12 لقطة...";
        var frames = await extractFrames(video, FRAME_COUNT);

        renderFrames(frames);
        progress.style.display = "none";
        cleanupVideo(video, url);

        statusEl.textContent = "⏳ جاري إرسال اللقطات للتحليل...";
        await sendToWorker(frames);

    } catch (err) {
        errorEl.textContent = "❌ خطأ: " + err.message;
        errorEl.style.display = "block";
        statusEl.style.display = "none";
        cleanupVideo(video, url);
        analyzeBtn.disabled = false;
        progress.style.display = "none";
    }
}

function cleanupVideo(video, url) {
    try {
        video.pause();
        video.removeAttribute("src");
        video.load();
        if (url) URL.revokeObjectURL(url);
    } catch (e) {}
}

function waitCanPlay(video) {
    return new Promise(function(resolve, reject) {
        if (video.readyState >= 3 && video.duration) { resolve(); return; }
        var done = false;
        function ok() { if (done) return; done = true; cleanup(); resolve(); }
        function err() { if (done) return; done = true; cleanup(); reject(new Error("فشل تحميل الفيديو")); }
        function cleanup() {
            video.removeEventListener("canplay", ok);
            video.removeEventListener("canplaythrough", ok);
            video.removeEventListener("loadeddata", ok);
            video.removeEventListener("error", err);
            clearTimeout(t);
        }
        video.addEventListener("canplay", ok);
        video.addEventListener("canplaythrough", ok);
        video.addEventListener("loadeddata", ok);
        video.addEventListener("error", err);
        var t = setTimeout(function() {
            if (done) return; done = true; cleanup();
            if (video.videoWidth && video.duration) resolve();
            else reject(new Error("انتهت المهلة"));
        }, 15000);
        try { video.load(); } catch(e) {}
    });
}

async function extractFrames(video, count) {
    var canvas = document.createElement("canvas");
    var vw = video.videoWidth || 640;
    var vh = video.videoHeight || 360;
    var ratio = vw / vh;
    var width = Math.min(FRAME_MAX_WIDTH, vw);
    var height = Math.round(width / ratio);
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext("2d");

    var duration = video.duration;
    var frames = [];
    var progress = document.getElementById("videoProgress");

    for (var i = 0; i < count; i++) {
        var t = (duration * (i + 0.5)) / count;
        await seekAndRender(video, t);
        ctx.drawImage(video, 0, 0, width, height);
        frames.push({ timestamp: t, dataUrl: canvas.toDataURL("image/jpeg", 0.75) });
        progress.value = ((i + 1) / count) * 100;
    }
    return frames;
}

function seekAndRender(video, time) {
    return new Promise(function(resolve) {
        var done = false;
        var finish = function() {
            if (done) return;
            done = true;
            video.removeEventListener("seeked", onSeeked);
            setTimeout(resolve, 250);
        };
        var onSeeked = function() {
            if (typeof video.requestVideoFrameCallback === "function") {
                video.requestVideoFrameCallback(function() { finish(); });
                setTimeout(finish, 400);
            } else {
                finish();
            }
        };
        video.addEventListener("seeked", onSeeked);
        try { video.currentTime = time; } catch(e) { resolve(); return; }
        setTimeout(finish, 3000);
    });
}

function renderFrames(frames) {
    var grid = document.getElementById("framesGrid");
    var title = document.getElementById("framesTitle");
    grid.innerHTML = "";
    title.classList.add("show");
    for (var i = 0; i < frames.length; i++) {
        var f = frames[i];
        var div = document.createElement("div");
        div.className = "frame-item";
        div.innerHTML = '<img src="' + f.dataUrl + '"><span class="frame-time">' + fmtTime(f.timestamp) + '</span>';
        grid.appendChild(div);
    }
}

function fmtTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
}

async function sendToWorker(frames) {
    var videoMode = document.getElementById("videoMode");
    var statusEl = document.getElementById("videoStatus");
    var errorEl = document.getElementById("videoError");
    var analyzeBtn = document.getElementById("analyzeVideoBtn");

    var loading = document.createElement("div");
    loading.id = "analysisLoading";
    loading.style.cssText = "text-align:center;padding:30px 15px;color:#D4AF37;font-size:14px;";
    loading.innerHTML = '<div style="font-size:40px;margin-bottom:10px;">🧠</div>جاري التحليل...<br><span style="font-size:11px;color:#888;">15-30 ثانية</span>';
    videoMode.appendChild(loading);

    try {
        var res = await fetch(WORKER_URL + "/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ frames: frames })
        });
        var data = await res.json();
        loading.remove();

        if (!res.ok || !data.success) {
            errorEl.textContent = "❌ فشل التحليل: " + (data.details || data.error || "خطأ");
            errorEl.style.display = "block";
            statusEl.style.display = "none";
            analyzeBtn.disabled = false;
            return;
        }

        statusEl.style.display = "none";
        renderAnalysis(data.analysis);
        analyzeBtn.disabled = false;
    } catch (err) {
        loading.remove();
        errorEl.textContent = "❌ خطأ في الاتصال: " + err.message;
        errorEl.style.display = "block";
        statusEl.style.display = "none";
        analyzeBtn.disabled = false;
    }
}

function renderAnalysis(text) {
    var videoMode = document.getElementById("videoMode");
    var card = document.createElement("div");
    card.id = "analysisResult";
    card.innerHTML = '<h3>📊 التحليل التكتيكي</h3><div class="content"></div>';
    card.querySelector(".content").textContent = text;
    videoMode.appendChild(card);
    setTimeout(function() { card.scrollIntoView({ behavior: "smooth", block: "start" }); }, 100);
}

// ============ CHAT ============
var conversationHistory = [];
var isProcessing = false;
var SYSTEM_PROMPT = 'أنت "المدرب الذكي"، محلل كروي خبير متخصص في لعبة eFootball من Konami.\n\nشخصيتك:\n- تتكلم بالعربية الفصحى المبسطة\n- ودود ومتحمس\n- محلل تكتيكي عميق\n\nخبرتك: كل أساليب اللعب، الخطط، المدربين.\n\nقواعدك: لا تخترع معلومات، اذكر السبب.';

function switchMode(mode) {
    document.getElementById("chatTab").classList.toggle("active", mode === "chat");
    document.getElementById("videoTab").classList.toggle("active", mode === "video");
    document.getElementById("chatMode").classList.toggle("active", mode === "chat");
    document.getElementById("videoMode").classList.toggle("active", mode === "video");
}

function setupChat() {
    var input = document.getElementById("userInput");
    var btn = document.getElementById("sendBtn");
    input.addEventListener("input", function() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    btn.addEventListener("click", sendMessage);
}

function quickAsk(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

async function sendMessage() {
    if (isProcessing) return;
    var input = document.getElementById("userInput");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    var welcome = document.getElementById("welcome");
    if (welcome) welcome.style.display = "none";
    addMessage("user", text);
    conversationHistory.push({ role: "user", content: text });
    isProcessing = true;
    document.getElementById("sendBtn").disabled = true;
    var typingId = showTyping();
    try {
        var response = await callWorker();
        removeTyping(typingId);
        addMessage("ai", response);
        conversationHistory.push({ role: "assistant", content: response });
    } catch (err) {
        removeTyping(typingId);
        addMessage("ai", "❌ عذراً، صار خطأ: " + err.message);
    } finally {
        isProcessing = false;
        document.getElementById("sendBtn").disabled = false;
    }
}

async function callWorker() {
    var messages = [{ role: "system", content: SYSTEM_PROMPT }].concat(conversationHistory);
    var response = await fetch(WORKER_URL + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: MODEL, messages: messages, temperature: 0.85, max_tokens: 2000 })
    });
    if (!response.ok) {
        var errData = await response.json().catch(function() { return {}; });
        throw new Error((errData.error && errData.error.message) || ("خطأ " + response.status));
    }
    var data = await response.json();
    var text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) throw new Error("رد فارغ");
    return text.trim();
}

function addMessage(role, text) {
    var chatArea = document.getElementById("chatArea");
    var msg = document.createElement("div");
    msg.className = "message " + role;
    var avatar = role === "user" ? "👤" : "🤖";
    msg.innerHTML = '<div class="msg-avatar">' + avatar + '</div><div class="msg-content"></div>';
    msg.querySelector(".msg-content").textContent = text;
    chatArea.appendChild(msg);
    setTimeout(function() { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

function showTyping() {
    var chatArea = document.getElementById("chatArea");
    var id = "typing-" + Date.now();
    var msg = document.createElement("div");
    msg.className = "message ai";
    msg.id = id;
    msg.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>';
    chatArea.appendChild(msg);
    setTimeout(function() { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
    return id;
}

function removeTyping(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
}

function clearChat() {
    if (!confirm("تمسح المحادثة؟")) return;
    conversationHistory = [];
    document.getElementById("chatArea").innerHTML = '<div class="welcome" id="welcome"><span class="welcome-icon">⚽</span><h2>أهلاً بك في المدرب الذكي</h2><p>اسألني عن أي شي في eFootball: خطط، مدربين، تبديلات، تكتيكات...</p></div>';
}

window.addEventListener("load", function() {
    setupChat();
    document.getElementById("chatTab").addEventListener("click", function() { switchMode("chat"); });
    document.getElementById("videoTab").addEventListener("click", function() { switchMode("video"); });
    document.getElementById("clearBtn").addEventListener("click", clearChat);
    var btns = document.querySelectorAll(".suggestion-btn");
    for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function() { quickAsk(this.dataset.q); });
    }
});
</script>
