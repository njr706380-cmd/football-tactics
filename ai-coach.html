<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Cairo', sans-serif; background: #050505; color: #FFF; display: flex; flex-direction: column; }
.bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.12), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(74,144,226,0.15), transparent 50%), #050505; }

.top-header { background: rgba(10,10,10,0.95); border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 12px 15px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(15px); flex-shrink: 0; }
.back-btn { color: #D4AF37; text-decoration: none; width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.3); background: rgba(0,0,0,0.3); font-size: 18px; flex-shrink: 0; }
.ai-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 0 20px rgba(212,175,55,0.4); }
.header-title-wrap { flex: 1; overflow: hidden; }
.header-title { font-size: 16px; font-weight: 900; color: #D4AF37; }
.header-status { font-size: 11px; color: #4CAF50; display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.clear-btn { color: #888; background: transparent; border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; }

.mode-tabs { display: flex; padding: 10px 15px; gap: 8px; background: rgba(10,10,10,0.95);
    border-bottom: 1px solid rgba(212,175,55,0.2); flex-shrink: 0; }
.mode-tab { flex: 1; padding: 10px; background: transparent; border: 2px solid rgba(212,175,55,0.2);
    color: #888; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.mode-tab.active { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; border-color: #D4AF37; }

.chat-mode { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.video-mode { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 15px; }
.video-mode.active { display: flex; }
.chat-mode.active { display: flex; }

.chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 3px; }

.message { display: flex; gap: 10px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { flex-direction: row-reverse; }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 16px; flex-shrink: 0; }
.message.user .msg-avatar { background: rgba(212,175,55,0.2); border: 1px solid #D4AF37; }
.message.ai .msg-avatar { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; }
.msg-content { background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.15); border-radius: 18px;
    padding: 12px 16px; font-size: 14px; line-height: 1.8; max-width: calc(100% - 60px); white-space: pre-wrap; word-wrap: break-word; }
.message.user .msg-content { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.08)); border-color: rgba(212,175,55,0.4); }

.typing { display: flex; gap: 5px; padding: 6px 0; }
.typing span { width: 8px; height: 8px; background: #D4AF37; border-radius: 50%; animation: typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }

.welcome { text-align: center; padding: 30px 20px; }
.welcome-icon { font-size: 60px; margin-bottom: 15px; display: inline-block; animation: pulse 2s infinite; }
.welcome h2 { font-size: 20px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
.welcome p { color: #888; font-size: 13px; line-height: 1.7; max-width: 400px; margin: 0 auto; }

.suggestions { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.suggestions::-webkit-scrollbar { display: none; }
.suggestion-btn { padding: 8px 14px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37; border-radius: 20px; font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; }

.input-area { padding: 12px 15px; background: rgba(10,10,10,0.95); border-top: 1px solid rgba(212,175,55,0.2);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.input-wrap { flex: 1; }
#userInput { width: 100%; background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.2);

#userInput:focus { border-color: rgba(212,175,55,0.5); }
#userInput::placeholder { color: #666; }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #050505; flex-shrink: 0; box-shadow: 0 5px 20px rgba(212,175,55,0.3); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.info-box { background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.5); color: #F39C12;
    padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
.upload-box { background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(10,10,10,0.95));

    cursor: pointer; margin-bottom: 20px; }
.upload-icon { font-size: 50px; margin-bottom: 15px; display: block; }
.upload-title { font-size: 18px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
.upload-hint { color: #888; font-size: 13px; }
#fileInput { display: none; }
.preview { margin-top: 20px; text-align: center; display: none; }
.preview.show { display: block; }
.preview video { max-width: 100%; max-height: 250px; border-radius: 15px;
    border: 2px solid rgba(212,175,55,0.4); margin-bottom: 15px; }
.preview-name { color: #888; font-size: 13px; margin-bottom: 10px; }

.btn { padding: 15px 25px; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700;
    border: none; border-radius: 15px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px; width: 100%; margin-bottom: 12px; }
.btn-primary { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: rgba(255,255,255,0.05); color: #D4AF37; border: 2px solid rgba(212,175,55,0.3); }

.progress-container { display: none; margin: 20px 0; }
.progress-container.show { display: block; }
.progress-bar { width: 100%; height: 8px; background: rgba(212,175,55,0.15); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #D4AF37, #F4D03F); width: 0%; transition: width 0.3s; border-radius: 10px; }
.progress-text { color: #D4AF37; font-size: 13px; font-weight: 700; text-align: center; }

.frames-preview { display: none; margin: 15px 0; padding: 10px;
    background: rgba(20,20,20,0.7); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; }
.frames-preview.show { display: block; }
.frames-title { color: #D4AF37; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.frames-grid { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
.frames-grid img { height: 70px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); flex-shrink: 0; }

.results { display: none; margin-top: 20px; }
.results.show { display: block; animation: fadeIn 0.5s ease; }
.results-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(212,175,55,0.2); }
.results-title { font-size: 20px; font-weight: 900; color: #D4AF37; }
.result-content { background: rgba(15,15,15,0.7); border: 1px solid rgba(212,175,55,0.2); border-radius: 15px;
    padding: 18px; color: #e0e0e0; font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-wrap: break-word; }
.error-box { background: rgba(231,76,60,0.15); border: 1px solid #E74C3C; color: #E74C3C;
    padding: 12px 15px; border-radius: 12px; margin-top: 15px; display: none; font-size: 13px; line-height: 1.6; }
.error-box.show { display: block; }
</style>

<!-- Puter.js - الخدمة المجانية -->
<script src="https://js.puter.com/v2/"></script>

<script>
// ============ إعدادات الشات ============
const GROQ_CONFIG = {
    API_KEY: "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",
    MODEL: "openai/gpt-oss-120b",
    API_URL: "https://api.groq.com/openai/v1/chat/completions"
};

let conversationHistory = [];
let isProcessing = false;
let selectedFile = null;
let videoObjectUrl = null;

const SYSTEM_PROMPT = `أنت "المدرب الذكي"، محلل كروي خبير متخصص في لعبة eFootball من Konami.

شخصيتك:
- تتكلم بالعربية الفصحى المبسطة
- ودود ومتحمس
- محلل تكتيكي عميق
- تعطي نصائح عملية فورية

خبرتك:
- كل أساليب اللعب (استحواذ، مرتدات، ضغط عالي، كرة طويلة)
- كل الخطط (4-3-3، 4-4-2، 3-2-4-1، 4-2-3-1، 3-4-2-1، إلخ)
- كل المدربين (بيب، كلوب، مورينهو، كرويف، تشافي ألونسو، فليك، دي شامب، أموريم، لامبارد)
- تحليل الخصوم والتبديلات

قواعدك:
1. لا تخترع معلومات
2. اعطي إجابات مفصلة ومباشرة
3. اذكر السبب وراء كل نصيحة
4. استخدم الإيموجي باعتدال

كن مختصراً لكن شامل.`;

const VISION_PROMPT = `أنت مدرب كرة قدم خبير في eFootball. هذه 6 لقطات متتالية من مباراة.

حلل المباراة بالعربية وأعطني:

1. **الوضع العام:**
   - شنو تشوف؟ (نتيجة، وقت، تشكيلة)
   - أسلوب اللعب الظاهر

2. **نقاط القوة (3-5)**

3. **نقاط الضعف (3-5)**

4. **التحليل التكتيكي:**
   - التمركزات
   - البناء
   - الضغط

5. **النصائح (3-5):**
   - نصائح عملية فورية

6. **التوصية النهائية:**
   - أي مدرب يناسبه؟ (من: بيب، كلوب، مورينهو، كرويف، تشافي ألونسو، فليك، دي شامب، أموريم، لامبارد)

كن مباشر ومفيد.`;

// ============ التبديل ============
function switchMode(mode) {
    document.getElementById("chatTab").classList.toggle("active", mode === "chat");
    document.getElementById("videoTab").classList.toggle("active", mode === "video");
    document.getElementById("chatMode").classList.toggle("active", mode === "chat");
    document.getElementById("videoMode").classList.toggle("active", mode === "video");
}

// ============ المحادثة ============
function setupChat() {
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    btn.addEventListener("click", sendMessage);
}

function quickAsk(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

async function sendMessage() {
    if (isProcessing) return;
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.style.display = "none";

    addMessage("user", text);
    conversationHistory.push({ role: "user", content: text });

    isProcessing = true;
    document.getElementById("sendBtn").disabled = true;
    const typingId = showTyping();

    try {
        const response = await callGroq();
        removeTyping(typingId);
        addMessage("ai", response);
        conversationHistory.push({ role: "assistant", content: response });
    } catch (err) {
        removeTyping(typingId);
        addMessage("ai", "❌ عذراً، صار خطأ: " + err.message);
    } finally {
        isProcessing = false;
        document.getElementById("sendBtn").disabled = false;
    }
}

async function callGroq() {
    const messages = [
        { role: "system", content: SYSTEM_PROMPT },
        ...conversationHistory
    ];

    const response = await fetch(GROQ_CONFIG.API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_CONFIG.API_KEY
        },
        body: JSON.stringify({
            model: GROQ_CONFIG.MODEL,
            messages: messages,
            temperature: 0.85,
            max_tokens: 2000
        })
    });

    if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error?.message || `خطأ ${response.status}`);
    }

    const data = await response.json();
    const text = data.choices?.[0]?.message?.content;
    if (!text) throw new Error("رد فارغ");
    return text.trim();
}

function addMessage(role, text) {
    const chatArea = document.getElementById("chatArea");
    const msg = document.createElement("div");
    msg.className = "message " + role;
    const avatar = role === "user" ? "👤" : "🤖";
    msg.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-content"></div>`;
    msg.querySelector(".msg-content").textContent = text;
    chatArea.appendChild(msg);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

function showTyping() {
    const chatArea = document.getElementById("chatArea");
    const id = "typing-" + Date.now();
    const msg = document.createElement("div");
    msg.className = "message ai";
    msg.id = id;
    msg.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatArea.appendChild(msg);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
    return id;
}

function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function clearChat() {
    if (!confirm("تمسح المحادثة؟")) return;
    conversationHistory = [];
    document.getElementById("chatArea").innerHTML = `
        <div class="welcome" id="welcome">
            <span class="welcome-icon">⚽</span>
            <h2>أهلاً بك في المدرب الذكي</h2>
            <p>اسألني عن أي شي في eFootball: خطط، مدربين، تبديلات، تكتيكات...</p>
        </div>
    `;
}

// ============ الفيديو ============
function setupVideo() {
    const box = document.getElementById("uploadBox");
    const input = document.getElementById("fileInput");

    box.addEventListener("click", () => input.click());
    input.addEventListener("change", (e) => {
        if (e.target.files.length > 0) handleVideoFile(e.target.files[0]);
    });

    document.getElementById("analyzeBtn").addEventListener("click", analyzeVideo);
    document.getElementById("resetVideoBtn").addEventListener("click", resetVideo);
}

function handleVideoFile(file) {
    if (!file.type.startsWith("video/")) {
        showVideoError("الملف لازم يكون فيديو");
        return;
    }
    if (file.size > 20 * 1024 * 1024) {
        showVideoError("الحجم كبير (الحد 20 ميجا)");
        return;
    }

    selectedFile = file;
    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
    videoObjectUrl = URL.createObjectURL(file);

    document.getElementById("previewVideo").src = videoObjectUrl;
    document.getElementById("previewName").textContent = `${file.name} • ${(file.size / (1024*1024)).toFixed(1)} MB`;
    document.getElementById("preview").classList.add("show");
    document.getElementById("analyzeBtn").disabled = false;
    document.getElementById("framesPreview").classList.remove("show");
    document.getElementById("results").classList.remove("show");
    hideVideoError();
}

async function extractFrames(video, count = 6) {
    return new Promise((resolve, reject) => {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext("2d");
        const frames = [];
        const duration = video.duration;
        const interval = duration / (count + 1);

        let currentFrame = 0;

        const onSeeked = () => {
            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                frames.push(dataUrl);
                currentFrame++;
                if (currentFrame < count) {
                    video.currentTime = (currentFrame + 1) * interval;
                } else {
                    video.removeEventListener("seeked", onSeeked);
                    resolve(frames);
                }
            } catch (err) {
                reject(err);
            }
        };

        video.addEventListener("seeked", onSeeked);
        video.currentTime = interval;
    });
}

async function analyzeVideo() {
    if (!selectedFile) { showVideoError("ارفع فيديو أولاً"); return; }

    document.getElementById("analyzeBtn").disabled = true;
    document.getElementById("results").classList.remove("show");
    hideVideoError();
    showProgress(10, "جاري تحميل الفيديو...");

    try {
        const video = document.createElement("video");
        video.src = videoObjectUrl;
        video.muted = true;
        video.playsInline = true;

        await new Promise((resolve, reject) => {
            video.onloadedmetadata = () => resolve();
            video.onerror = () => reject(new Error("فشل تحميل الفيديو"));
            setTimeout(() => reject(new Error("انتهت المدة")), 10000);
        });

        showProgress(30, "جاري استخراج اللقطات...");

        const frames = await extractFrames(video, 6);

        const grid = document.getElementById("framesGrid");
        grid.innerHTML = "";
        frames.forEach(f => {
            const img = document.createElement("img");
            img.src = f;
            grid.appendChild(img);
        });
        document.getElementById("framesPreview").classList.add("show");

        showProgress(50, "جاري إرسال اللقطات للـ AI...");

        // بناء محتوى الرسالة مع الصور
        const contentArray = [{ type: "text", text: VISION_PROMPT }];
        frames.forEach(f => {
            contentArray.push({ type: "image_url", image_url: { url: f } });
        });

        showProgress(70, "AI يحلل المباراة...");

        // استخدام Puter.js
        const response = await puter.ai.chat(
            contentArray,
            { model: "gpt-4o-mini" }
        );

        let text = "";
        if (typeof response === "string") {
            text = response;
        } else if (response && response.message && response.message.content) {
            if (typeof response.message.content === "string") {
                text = response.message.content;
            } else if (Array.isArray(response.message.content)) {
                text = response.message.content.map(c => c.text || "").join("");
            }
        } else if (response && response.text) {
            text = response.text;
        } else {
            text = JSON.stringify(response);
        }

        if (!text) throw new Error("ما وصل رد من AI");

        showProgress(100, "اكتمل!");
        setTimeout(() => {
            hideProgress();
            document.getElementById("resultContent").textContent = text;
            document.getElementById("results").classList.add("show");
            document.getElementById("results").scrollIntoView({ behavior: "smooth" });
        }, 500);

    } catch (err) {
        console.error(err);
        hideProgress();
        showVideoError("حدث خطأ: " + err.message);
    } finally {
        document.getElementById("analyzeBtn").disabled = false;
    }
}

function showProgress(percent, text) {
    document.getElementById("progressContainer").classList.add("show");
    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressText").textContent = text + " " + percent + "%";
}

function hideProgress() {
    document.getElementById("progressContainer").classList.remove("show");
}

function showVideoError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.classList.add("show");
}

function hideVideoError() {
    document.getElementById("errorBox").classList.remove("show");
}

function resetVideo() {
    selectedFile = null;
    if (videoObjectUrl) { URL.revokeObjectURL(videoObjectUrl); videoObjectUrl = null; }
    document.getElementById("fileInput").value = "";
    document.getElementById("preview").classList.remove("show");
    document.getElementById("framesPreview").classList.remove("show");
    document.getElementById("results").classList.remove("show");
    document.getElementById("analyzeBtn").disabled = true;
    hideVideoError();
    hideProgress();
}

// ============ التهيئة ============
window.addEventListener("load", () => {
    setupChat();
    setupVideo();

    document.getElementById("chatTab").addEventListener("click", () => switchMode("chat"));
    document.getElementById("videoTab").addEventListener("click", () => switchMode("video"));
    document.getElementById("clearBtn").addEventListener("click", () => {
        if (document.getElementById("chatMode").classList.contains("active")) clearChat();
        else resetVideo();
    });

    document.querySelectorAll(".suggestion-btn").forEach(btn => {
        btn.addEventListener("click", () => quickAsk(btn.dataset.q));
    });
});
</script>
