<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرب الذكي | AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Cairo', sans-serif; background: #050505; color: #FFF; display: flex; flex-direction: column; }
.bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.12), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(74,144,226,0.15), transparent 50%), #050505; }

.top-header { background: rgba(10,10,10,0.95); border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 12px 15px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(15px); flex-shrink: 0; }
.back-btn { color: #D4AF37; text-decoration: none; width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.3); background: rgba(0,0,0,0.3); font-size: 18px; flex-shrink: 0; }
.ai-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 0 20px rgba(212,175,55,0.4); }
.header-title-wrap { flex: 1; overflow: hidden; }
.header-title { font-size: 16px; font-weight: 900; color: #D4AF37; }
.header-status { font-size: 11px; color: #4CAF50; display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.clear-btn { color: #888; background: transparent; border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; }

.mode-tabs { display: flex; padding: 10px 15px; gap: 8px; background: rgba(10,10,10,0.95);
    border-bottom: 1px solid rgba(212,175,55,0.2); flex-shrink: 0; }
.mode-tab { flex: 1; padding: 10px; background: transparent; border: 2px solid rgba(212,175,55,0.2);
    color: #888; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.mode-tab.active { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; border-color: #D4AF37; }

.chat-mode { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.video-mode { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 15px; }
.video-mode.active { display: flex; }
.chat-mode.active { display: flex; }

.chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 3px; }

.message { display: flex; gap: 10px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { flex-direction: row-reverse; }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 16px; flex-shrink: 0; }
.message.user .msg-avatar { background: rgba(212,175,55,0.2); border: 1px solid #D4AF37; }
.message.ai .msg-avatar { background: linear-gradient(135deg, #D4AF37, #F4D03F); color: #050505; }
.msg-content { background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.15); border-radius: 18px;
    padding: 12px 16px; font-size: 14px; line-height: 1.8; max-width: calc(100% - 60px); white-space: pre-wrap; word-wrap: break-word; }
.message.user .msg-content { background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.08)); border-color: rgba(212,175,55,0.4); }

.typing { display: flex; gap: 5px; padding: 6px 0; }
.typing span { width: 8px; height: 8px; background: #D4AF37; border-radius: 50%; animation: typing 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }

.welcome { text-align: center; padding: 30px 20px; }
.welcome-icon { font-size: 60px; margin-bottom: 15px; display: inline-block; animation: pulse 2s infinite; }
.welcome h2 { font-size: 20px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
.welcome p { color: #888; font-size: 13px; line-height: 1.7; max-width: 400px; margin: 0 auto; }

.suggestions { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.suggestions::-webkit-scrollbar { display: none; }
.suggestion-btn { padding: 8px 14px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37; border-radius: 20px; font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; }

.input-area { padding: 12px 15px; background: rgba(10,10,10,0.95); border-top: 1px solid rgba(212,175,55,0.2);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.input-wrap { flex: 1; }
#userInput { width: 100%; background: rgba(20,20,20,0.9); border: 1px solid rgba(212,175,55,0.2);
    border-radius: 20px; padding: 12px 18px; color: #FFF; font-family: inherit; font-size: 14px;
    resize: none; outline: none; max-height: 120px; min-height: 44px; line-height: 1.5; }
#userInput:focus { border-color: rgba(212,175,55,0.5); }
#userInput::placeholder { color: #666; }
.send-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #F4D03F);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #050505; flex-shrink: 0; box-shadow: 0 5px 20px rgba(212,175,55,0.3); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.info-box { background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.5); color: #F39C12;
    padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
.upload-box { background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(10,10,10,0.95));
    border: 2px dashed rgba(212,175,55,0.3); border-radius: 20px; padding: 40px 20px; text-align: center;
    cursor: pointer; margin-bottom: 20px; }
.upload-icon { font-size: 50px; margin-bottom: 15px; display: block; }
.upload-title { font-size: 18px; font-weight: 900; color: #D4AF37; margin-bottom: 8px; }
.upload-hint { color: #888; font-size: 13px; }
</style>
</head>
<body>
<div class="bg-animation"></div>

<div class="top-header">
    <a href="index.html" class="back-btn">→</a>
    <div class="ai-avatar">🤖</div>
    <div class="header-title-wrap">
        <div class="header-title">المدرب الذكي</div>
        <div class="header-status"><span class="status-dot"></span><span>متاح الآن</span></div>
    </div>
    <button class="clear-btn" id="clearBtn">مسح</button>
</div>

<div class="mode-tabs">
    <button class="mode-tab active" id="chatTab">💬 محادثة</button>
    <button class="mode-tab" id="videoTab">🎥 تحليل فيديو</button>
</div>

<div class="chat-mode active" id="chatMode">
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
            <span class="welcome-icon">⚽</span>
            <h2>أهلاً بك في المدرب الذكي</h2>
            <p>اسألني عن أي شي في eFootball: خطط، مدربين، تبديلات، تكتيكات...</p>
        </div>
    </div>
    <div class="suggestions">
        <button class="suggestion-btn" data-q="شنو أفضل خطة ضد 4-4-2؟">ضد 4-4-2</button>
        <button class="suggestion-btn" data-q="شلون أوقف المرتدات؟">إيقاف المرتدات</button>
        <button class="suggestion-btn" data-q="أنا خسران 1-0 بالدقيقة 70، شنو أسوي؟">خسران متأخر</button>
        <button class="suggestion-btn" data-q="أفضل مدرب لأسلوب الاستحواذ؟">مدرب استحواذ</button>
        <button class="suggestion-btn" data-q="شلون ألعب ضد الضغط العالي؟">ضد الضغط</button>
    </div>
    <div class="input-area">
        <div class="input-wrap">
            <textarea id="userInput" placeholder="اكتب سؤالك..." rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<div class="video-mode" id="videoMode">
    <div class="info-box">
        ⚠️ <b>ملاحظة:</b> تحليل الفيديو قيد التطوير. استخدم <b>المحادثة</b> حالياً.
    </div>
    <div class="upload-box">
        <span class="upload-icon">🎥</span>
        <div class="upload-title">ارفع فيديو من مباراتك</div>
        <div class="upload-hint">قريباً...</div>
    </div>
</div>

<script>
// ============ الإعدادات - داخل الملف مباشرة ============
const AI_CONFIG = {
    API_KEY: "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",
    MODEL: "llama-3.3-70b-versatile",
    API_URL: "https://api.groq.com/openai/v1/chat/completions"
};

// ============ المتغيرات ============
let conversationHistory = [];
let isProcessing = false;

const SYSTEM_PROMPT = `أنت "المدرب الذكي"، محلل كروي خبير متخصص في لعبة eFootball من Konami.

شخصيتك:
- تتكلم بالعربية الفصحى المبسطة
- ودود ومتحمس
- محلل تكتيكي عميق
- تعطي نصائح عملية فورية

خبرتك:
- كل أساليب اللعب (استحواذ، مرتدات، ضغط عالي، كرة طويلة)
- كل الخطط (4-3-3، 4-4-2، 3-2-4-1، 4-2-3-1، 3-4-2-1، إلخ)
- كل المدربين (بيب جوارديولا، كلوب، مورينهو، كرويف، تشافي ألونسو، فليك، دي شامب، أموريم، لامبارد)
- تحليل الخصوم
- التبديلات التكتيكية
- تحسين التشكيلة

قواعدك:
1. لا تخترع معلومات عن اللعبة
2. إذا ما تعرف، قول "ما عندي معلومات كافية"
3. اعطي إجابات مفصلة ومباشرة
4. اذكر السبب وراء كل نصيحة
5. اقترح مدرب مناسب إذا كان السياق يستدعي
6. استخدم الإيموجي بشكل معتدل (⚽🎯🛡️🔥)

طريقة الإجابة:
- حلل الوضع أولاً
- اعطي توصيات مرقمة
- اذكر البديل لو النصيحة ما نفعت

كن مختصراً لكن شامل. لا تكتب مقالات طويلة.`;

// ============ التبديل ============
function switchMode(mode) {
    document.getElementById("chatTab").classList.toggle("active", mode === "chat");
    document.getElementById("videoTab").classList.toggle("active", mode === "video");
    document.getElementById("chatMode").classList.toggle("active", mode === "chat");
    document.getElementById("videoMode").classList.toggle("active", mode === "video");
}

// ============ المحادثة ============
function setupChat() {
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    btn.addEventListener("click", sendMessage);
}

function quickAsk(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

async function sendMessage() {
    if (isProcessing) return;
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.style.display = "none";

    addMessage("user", text);
    conversationHistory.push({ role: "user", content: text });

    isProcessing = true;
    document.getElementById("sendBtn").disabled = true;
    const typingId = showTyping();

    try {
        const response = await callGroq();
        removeTyping(typingId);
        addMessage("ai", response);
        conversationHistory.push({ role: "assistant", content: response });
    } catch (err) {
        removeTyping(typingId);
        addMessage("ai", "❌ عذراً، صار خطأ: " + err.message);
    } finally {
        isProcessing = false;
        document.getElementById("sendBtn").disabled = false;
    }
}

async function callGroq() {
    const messages = [
        { role: "system", content: SYSTEM_PROMPT },
        ...conversationHistory
    ];

    const response = await fetch(AI_CONFIG.API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + AI_CONFIG.API_KEY
        },
        body: JSON.stringify({
            model: AI_CONFIG.MODEL,
            messages: messages,
            temperature: 0.85,
            max_tokens: 2000
        })
    });

    if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        const msg = errData.error?.message || `خطأ ${response.status}`;
        throw new Error(msg);
    }

    const data = await response.json();
    const text = data.choices?.[0]?.message?.content;
    if (!text) throw new Error("رد فارغ");
    return text.trim();
}

function addMessage(role, text) {
    const chatArea = document.getElementById("chatArea");
    const msg = document.createElement("div");
    msg.className = "message " + role;
    const avatar = role === "user" ? "👤" : "🤖";
    msg.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-content"></div>`;
    msg.querySelector(".msg-content").textContent = text;
    chatArea.appendChild(msg);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

function showTyping() {
    const chatArea = document.getElementById("chatArea");
    const id = "typing-" + Date.now();
    const msg = document.createElement("div");
    msg.className = "message ai";
    msg.id = id;
    msg.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatArea.appendChild(msg);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
    return id;
}

function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function clearChat() {
    if (!confirm("تمسح المحادثة؟")) return;
    conversationHistory = [];
    document.getElementById("chatArea").innerHTML = `
        <div class="welcome" id="welcome">
            <span class="welcome-icon">⚽</span>
            <h2>أهلاً بك في المدرب الذكي</h2>
            <p>اسألني عن أي شي في eFootball: خطط، مدربين، تبديلات، تكتيكات...</p>
        </div>
    `;
}

// ============ التهيئة ============
window.addEventListener("load", () => {
    setupChat();

    document.getElementById("chatTab").addEventListener("click", () => switchMode("chat"));
    document.getElementById("videoTab").addEventListener("click", () => switchMode("video"));
    document.getElementById("clearBtn").addEventListener("click", clearChat);

    document.querySelectorAll(".suggestion-btn").forEach(btn => {
        btn.addEventListener("click", () => quickAsk(btn.dataset.q));
    });
});
</script>
</body>
</html>
