<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تابع رحلتنا | Football Tactics</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    min-height: 100vh;
    background: #050505;
    font-family: 'Cairo', sans-serif;
    color: #FFF;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: radial-gradient(circle at 20% 20%, rgba(212,175,55,0.15), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(74,144,226,0.15), transparent 45%),
                #050505;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    position: relative;
    min-height: 100vh;
}

/* منع long-press popup */
a, button, .social-circle, .back-btn {
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

.particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #D4AF37;
    border-radius: 50%;
    opacity: 0.4;
    box-shadow: 0 0 8px #D4AF37;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

.back-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: rgba(10,10,10,0.9);
    border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    text-decoration: none;
    z-index: 100;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.back-btn:hover, .back-btn:active {
    background: rgba(212,175,55,0.2);
    border-color: #D4AF37;
    transform: scale(1.1);
}

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
}

.title-wrap {
    animation: fadeInDown 0.8s ease forwards;
}

.main-title {
    font-size: 32px;
    font-weight: 900;
    color: #D4AF37;
    letter-spacing: 1px;
    text-shadow: 0 0 30px rgba(212,175,55,0.6),
                 0 0 60px rgba(212,175,55,0.3);
    margin-bottom: 8px;
    display: inline-block;
    position: relative;
}

.main-title::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    animation: shineBar 3s ease-in-out infinite;
}

@keyframes shineBar {
    0%,100% { opacity: 0.3; transform: scaleX(0.5); }
    50% { opacity: 1; transform: scaleX(1); }
}

.subtitle {
    font-size: 14px;
    color: #888;
    letter-spacing: 0.5px;
    animation: fadeIn 1s ease 0.3s both;
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.circles-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 30px 0;
}

.social-circle {
    --size: 95px;
    --glow: rgba(212,175,55,0.6);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    text-decoration: none;
    opacity: 0;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.social-circle .circle-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 25px var(--glow),
                0 8px 20px rgba(0,0,0,0.6);
    transition: all 0.4s ease;
}

.social-circle .circle-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.social-circle:hover .circle-inner::before,
.social-circle:active .circle-inner::before {
    opacity: 1;
}

.social-circle::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--glow);
    opacity: 0;
    transition: all 0.4s ease;
}

.social-circle:hover::after,
.social-circle:active::after {
    opacity: 1;
    inset: -12px;
}

.social-circle:hover,
.social-circle:active {
    transform: translateY(-8px) scale(1.08);
}

.social-circle:hover .circle-inner,
.social-circle:active .circle-inner {
    box-shadow: 0 0 45px var(--glow),
                0 0 80px var(--glow),
                0 12px 30px rgba(0,0,0,0.7);
}

.circle-icon {
    width: 46px;
    height: 46px;
    fill: #FFF;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    transition: transform 0.4s ease;
    position: relative;
    z-index: 2;
}

.social-circle:hover .circle-icon,
.social-circle:active .circle-icon {
    transform: scale(1.15) rotate(-5deg);
}

.social-circle.tg .circle-inner {
    background: linear-gradient(135deg, #229ED9 0%, #1C93C7 100%);
}
.social-circle.tg { --glow: rgba(34,158,217,0.7); }

.social-circle.ig .circle-inner {
    background: linear-gradient(135deg, #833AB4 0%, #FD1D1D 50%, #FCB045 100%);
}
.social-circle.ig { --glow: rgba(233,30,99,0.7); }

.social-circle.tt .circle-inner {
    background: linear-gradient(135deg, #000000 0%, #25F4EE 50%, #FE2C55 100%);
}
.social-circle.tt { --glow: rgba(254,44,85,0.7); }

.social-circle.tg {
    animation: circleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards,
               pulse 3s ease-in-out 1.5s infinite;
}
.social-circle.ig {
    animation: circleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               pulse 3s ease-in-out 1.8s infinite;
}
.social-circle.tt {
    animation: circleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards,
               pulse 3s ease-in-out 2.1s infinite;
}

@keyframes circleIn {
    0% { opacity: 0; transform: scale(0.3) translateY(30px); }
    60% { opacity: 1; transform: scale(1.1) translateY(-5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}

.social-name {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 700;
    color: #D4AF37;
    white-space: nowrap;
    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1s both;
}

.info-card {
    width: 100%;
    background: rgba(15,15,15,0.85);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 20px;
    padding: 25px 20px;
    backdrop-filter: blur(15px);
    animation: fadeInUp 0.8s ease 0.6s both;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5),
                0 0 40px rgba(212,175,55,0.08);
    margin-top: 35px;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.info-line {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    font-size: 14px;
    color: #CCC;
    line-height: 1.9;
    margin-bottom: 10px;
}

.info-line:last-child { margin-bottom: 0; }

.info-line .dot {
    width: 6px;
    height: 6px;
    background: #D4AF37;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px #D4AF37;
    animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.info-line.highlight {
    color: #D4AF37;
    font-weight: 700;
    font-size: 15px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #666;
    font-size: 12px;
    animation: fadeIn 1s ease 1s both;
    padding-bottom: 20px;
}

.footer .heart {
    color: #E91E63;
    animation: heartbeat 1.5s ease-in-out infinite;
    display: inline-block;
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@media (max-width: 380px) {
    .social-circle { --size: 82px; }
    .circle-icon { width: 38px; height: 38px; }
    .main-title { font-size: 26px; }
    .circles-wrap { gap: 10px; }
    .social-name { font-size: 11px; }
}
</style>
</head>
