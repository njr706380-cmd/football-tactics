<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الملعب التكتيكي | تكتيكات كرة القدم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #050505;
            color: #FFF;
        }

        /* منع long-press popup */
        a, button, .mode-btn, .side-btn, .back-btn {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(5,5,5,0.95), rgba(5,5,5,0.7), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .topbar > * { pointer-events: auto; }

        .back-btn {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 18px;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.3);
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(212,175,55,0.2);
            border-color: #D4AF37;
        }

        .style-title {
            color: #D4AF37;
            font-weight: 900;
            font-size: 18px;
            text-align: center;
            flex: 1;
        }

        .style-icon { font-size: 26px; }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container canvas {
            touch-action: none !important;
            display: block;
            outline: none;
        }

        .side-controls {
            position: fixed;
            top: 80px;
            right: 15px;
            z-index: 101;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #D4AF37;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .side-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: #D4AF37;
        }

        .side-btn.active {
            background: #D4AF37;
            color: #050505;
        }

        .bottom-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            z-index: 100;
            display: flex;
            gap: 8px;
            padding: 10px;
            background: rgba(10,10,10,0.85);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            max-width: calc(100% - 20px);
            flex-wrap: wrap;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bottom-controls.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(150px);
            pointer-events: none;
        }

        .mode-btn {
            padding: 10px 18px;
            background: transparent;
            border: 2px solid rgba(212,175,55,0.3);
            color: #D4AF37;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .mode-btn:hover {
            background: rgba(212,175,55,0.1);
            border-color: #D4AF37;
        }

        .mode-btn.active {
            background: #D4AF37;
            color: #050505;
            border-color: #D4AF37;
        }

        .mode-btn.demo-btn.active {
            background: #27AE60;
            color: #FFF;
            border-color: #27AE60;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(39, 174, 96, 0); }
        }

        .style-info {
            position: fixed;
            top: 80px;
            left: 15px;
            z-index: 100;
            padding: 18px;
            background: rgba(10,10,10,0.92);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 15px;
            backdrop-filter: blur(15px);
            width: 240px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .style-info.hidden {
            opacity: 0;
            transform: translateX(-120%);
            pointer-events: none;
        }

        .info-formations {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .formation-tag {
            padding: 4px 10px;
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.4);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #D4AF37;
        }

        .info-row {
            padding: 8px 0;
            border-bottom: 1px solid rgba(212,175,55,0.1);
            font-size: 12px;
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: #888;
            font-size: 10px;
            margin-bottom: 3px;
        }

        .info-value {
            color: #FFF;
            font-weight: 700;
            font-size: 13px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            color: #D4AF37;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212,175,55,0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .style-title { font-size: 15px; }
            .mode-btn { padding: 8px 12px; font-size: 12px; }
            .style-info {
                top: auto;
                bottom: 100px;
                left: 10px;
                right: 10px;
                width: auto;
                padding: 14px;
            }
            .style-info.hidden {
                transform: translateY(120%);
            }
            .side-controls {
                top: 70px;
                right: 10px;
            }
            .side-btn {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>جاري تحميل الملعب...</div>
    </div>

    <div class="topbar">
        <a href="index.html" class="back-btn">
            <span>→</span>
            <span>رجوع</span>
        </a>
        <div class="style-title" id="topTitle">جاري التحميل...</div>
        <div class="style-icon" id="topIcon">⚽</div>
    </div>

    <div class="side-controls">
        <button class="side-btn" id="infoToggleBtn" onclick="toggleInfo()" title="إظهار/إخفاء المعلومات">👁️</button>
        <button class="side-btn" id="controlsToggleBtn" onclick="toggleControls()" title="إظهار/إخفاء الأزرار">⚙️</button>
    </div>

    <div id="canvas-container"></div>

    <div class="style-info" id="styleInfo">
        <div class="info-formations" id="infoFormations"></div>
        <div class="info-row">
            <div class="info-label">الوضع الحالي</div>
            <div class="info-value" id="currentMode">الوضع</div>
        </div>
        <div class="info-row">
            <div class="info-label">الخطة</div>
            <div class="info-value" id="currentFormation">-</div>
        </div>
        <div class="info-row">
            <div class="info-label">الوصف</div>
            <div class="info-value" id="currentDesc">-</div>
        </div>
    </div>

    <div class="bottom-controls" id="bottomControls">
        <button class="mode-btn active" onclick="setMode('attacking')" id="btnAttack">
            ⚔️
            <span>هجوم</span>
        </button>
        <button class="mode-btn" onclick="setMode('defending')" id="btnDefend">
            🛡️
            <span>دفاع</span>
        </button>
        <button class="mode-btn demo-btn" onclick="startDemo()" id="demoBtn">
            📽️
            <span>شرح التعلم</span>
        </button>
        <button class="mode-btn" onclick="resetCamera()">
            🔄
            <span>تصفير الكاميرا</span>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="data.js"></script>
    <script src="tactic.js"></script>
    <script src="js/sounds.js"></script>
</body>
</html>
